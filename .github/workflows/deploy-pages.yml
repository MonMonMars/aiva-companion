# 推代码到 main → 自动打包 Web 版 → 发布到 GitHub Pages
# ---------------------------------------------------------------------------
# 首次使用：仓库 Settings → Pages → Source 选「GitHub Actions」。
# 之后每次 git push 都会重新打包发布。
name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署 Pages 必须要这三个权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一次部署；新的推送会顶掉正在跑的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 测试跑在**独立的 job** 里，和 build 并行，**不挡发布**。
  #
  # ⚠️ 别把它挪回 build 里当闸门（试过，直接把发布冻住了）：CI 上 `npm test`
  #    有一步挂，但本机 11 步全过、干净 checkout 副本里也全过，看不出是哪一步。
  #    在查清之前让它挡发布 = 站点停止更新。
  #
  #    （以前这里还写着「CI 日志要 admin 权限才拿得到」—— **后来实测推翻了**：
  #     git 凭据里的令牌就能直接 GET /actions/runs/{id}/logs 下整包 zip。
  #     教训：别把「接口拿不到」当永久结论，隔一阵要重测。）
  #
  #    那次 CI-only 的失败后来查清了，是 CI #29：workflow 里三行命令还写着
  #    已删除的 `tools/ext-resolve.mjs`，本地清单早换了 —— 现在由 lint-ci-refs
  #     的 A/B/C 三项盯着。详见README §6.14。
  #
  # 所以这里改成：**逐步跑 + 写进 Job Summary**，失败的那一步和它的输出直接
  # 显示在 run 页面上一眼看得到，不用去翻日志。「要不要让它挡发布」是发版策略，
  # 不是这个 job 能自己决定的 —— 目前 deploy 只 needs build。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 装依赖
        run: npm install --no-audit --no-fund

      - name: 跑全套测试（逐步，失败写进 Summary）
        run: |
          fails=0
          echo "| 步骤 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          run() {
            name="$1"; shift
            if "$@" > /tmp/step.log 2>&1; then
              # 逐步结果**也要打进日志**：只写 Summary 的话，成功时日志里一片空白，
              # 事后想确认"这一步真的在 CI 上跑过"就没有任何证据（日志包现在能下载）。
              echo "PASS  $name"
              echo "| $name | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              fails=$((fails+1))
              echo "FAIL  $name"
              # ⚠️ 失败分支**也必须打进日志**：只写 Summary 的话，事后下载日志包
              #    复盘时根本看不到挂的是哪一步、为什么挂（Summary 只能在网页上看，
              #    而且换一次运行就被覆盖）。这条是 CI #37 上真实吃过亏才补的 ——
              #    pipeline 那一步红了，日志里只有一行 exit code 1，无从下手。
              echo "----- $name 的输出（末 40 行）-----"
              tail -40 /tmp/step.log
              echo "-----------------------------------"
              echo "| $name | ❌ |" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>$name 的输出（末 40 行）</summary>" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -40 /tmp/step.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          }
          run "check-persona-coverage" node tools/check-persona-coverage.mjs
          run "withTimeout" node tools/test-with-timeout.mjs
          run "auth-timeout" node --import ./tools/src-resolve.mjs tools/test-auth-timeout.mjs
          run "net-timeout" node --import ./tools/src-resolve.mjs tools/test-net-timeout.mjs
          run "nativeSpeech" node tools/nativeSpeech.test.mjs
          run "espeak" node tools/espeak.test.mjs
          run "tts" node tools/tts.test.mjs
          run "songs" node tools/songs.test.mjs
          run "pipeline" node tools/pipeline.test.mjs
          run "rig-semantics" node --import ./tools/src-resolve.mjs tools/test-rig-semantics.mjs
          run "inspect-character" node tools/inspect-character.mjs
          run "realistic-pipeline" node tools/test-realistic-pipeline.mjs
          run "lint-imports" node tools/lint-imports.mjs .
          # 第 C 项检查（相对 import 必须在磁盘上落地）挡的就是 #25 那次：
          # src/llm.js 写成 './netFetch'（正确是 './lib/netFetch'），
          # 本地 node --check 不解析路径、15 步全绿，只有 Metro 打包才炸。
          run "lint-styles" node tools/lint-styles.mjs .
          # 这条盯的是「对外请求有没有走 netFetch」—— 同一个漏兜底的 bug
          # 已经在 auth / database / STT/TTS / llm / web / region 六处出现过，
          # 光靠"下次记得"守不住，必须在 CI 上跑。
          run "lint-net-calls" node tools/lint-net-calls.mjs
          # 这条补的是 CI build job 的盲区：它只导 web，
          # 于是「原生端能不能打包」一直没人验证过 —— 而同一入口在原生是 830 个模块、
          # web 只有 546（相差的都是只有打原生才走到的代码）。缺了成员实现
          # （如 Avatar3D.native.js）时，web 打包照样全绿。
          # 本地要给第 17 步留产物所以带 --keep，CI 上没有冒烟那一步，原先不带。
          # 现在 CI 也要跑冒烟了，两边就都得留产物（顺带让 C 项的命令行完全一致）。
          run "bundle(web+ios)" node tools/verify-bundle.mjs . --keep
          # 运行时冒烟：把上一步打出来的产物在 headless Chrome 里真的 boot 一遍。
          # ⚠️ 这一步原先**只挂本地**（Chrome 路径 + swiftshader 软渲染都依赖本机），
          #    后来在 ubuntu runner 上实测过了：自带 Chrome 153（/usr/bin/google-chrome），
          #    软渲染也能跑。先当观察位跑了三轮（#33/#34/#35）确认不飘，才收进来。
          run "smoke-runtime" node tools/smoke-runtime.mjs .
          # 这一条盯的是**验收本身**：workflow 里引用的文件是否还在、
          # CI 的每一步是否本地套装里也有。
          # 起因是把两套 loader 合并删掉 ext-resolve.mjs 之后，本地全绿、
          # 只有 CI test job 红 —— 那三行 `node --import ./tools/ext-resolve.mjs`
          # 还躺在上面的清单里没改。详见 tools/lint-ci-refs.mjs 顶部注释。
          run "lint-ci-refs" node tools/lint-ci-refs.mjs .
          # 验上一条**自己有没有牙齿**：造几处坏掉的 CI 配置（在沙盒副本里改），
          # 确认那条检查真会变红。规则被放宽时会先在这里露出来。
          run "lint-ci-refs-teeth" node tools/test-lint-ci-refs-teeth.mjs .
          # 验冒烟**自己有没有牙齿**：把产物里的 .glb 全藏起来再跑一次，
          # 确认前四条老断言照绿放行、只有「模型挂上」把得住。
          # 断言被放宽时「所有测试照旧全绿」是最容易出现的假象，所以让它常驻。
          run "smoke-runtime-teeth" node tools/test-smoke-runtime-teeth.mjs .
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "失败 $fails 项" >> $GITHUB_STEP_SUMMARY
          exit $fails

  # （这里原先有个独立的 smoke-probe job，挂着 continue-on-error 当观察位。
  #  连绿三轮确认不飘之后，冒烟已经并进上面的 test job 了 —— 收进来之后它才
  #  被 lint-ci-refs 的 A/B/C 三项覆盖，本地清单和 CI 清单才算真对上。）

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 装依赖
        run: npm install --no-audit --no-fund

      # Pages 把站点挂在 https://<用户名>.github.io/<仓库名>/ 下，
      # 而 Expo 默认把资源写成绝对路径 /assets/... —— 不设 baseUrl 会整站 404。
      # 仓库名若就叫 <用户名>.github.io，站点在根路径，此时 baseUrl 必须是 /。
      - name: 按仓库名设置 baseUrl
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));const n=process.env.REPO_NAME;const base=n.endsWith('.github.io')?'/':'/'+n+'/';j.expo.experiments=Object.assign({},j.expo.experiments,{baseUrl:base});fs.writeFileSync('app.json',JSON.stringify(j,null,2));console.log('baseUrl =',base)"

      - name: 导出 Web 静态包
        run: npx expo export --platform web
        env:
          CI: "1"

      # 红线顺序，一步都不能少（详见 README「放到 GitHub Pages」一节）：
      #   fixhtml     → 注入启动兜底（含 iOS 捏合缩放拦截）+ 复制 server.js
      #   buildadmin  → 补回 admin.html（expo export 会清空 dist）
      #   precompress → 预压 .br/.gz
      - name: 打包后处理（红线顺序）
        run: |
          node tools/fixhtml.mjs
          node tools/buildadmin.mjs
          node tools/precompress.mjs

      # _expo/ 这类下划线开头的目录会被 Jekyll 吃掉，加 .nojekyll 关掉它
      - name: 关掉 Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ⚠️ 这个 job 不会自动带上仓库文件（checkout 只在 build 里做过），
      #    不补这两步，下面 node tools/verify-live.mjs 会直接「找不到文件」。
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: deployment
        uses: actions/deploy-pages@v4
        # 这里原来挂着 `enablement: true`，注释说「让这一步自己把 Pages 打开」。
        # ⚠️ **实测那条注释是错的**：v4 已经不接受这个输入了 —— 每次部署都会打
        #    `Unexpected input(s) 'enablement', valid inputs are ['token','timeout',
        #    'error_count','reporting_interval','artifact_name','preview']`，
        #    也就是它一直被**静默忽略**，从来没起过作用。
        #    所以 Pages 得先在仓库里手动开：Settings → Pages → Source 选
        #    「GitHub Actions」。没开的话这一步会报
        #      Get Pages site failed. Error: HttpError: Not Found
        #    ——「开仓库」和「开 Pages」是两个独立开关，调 API 建仓库不会顺带开 Pages。
      - name: 打印网址
        run: echo "Pages 网址 = ${{ steps.deployment.outputs.page_url }}"

      # 发版不等于上线：中间隔着 Pages 缓存和 CDN，刚部署完立刻抓往往还是旧 bundle
      # （实测抓到过哈希和上一版完全一样的包，于是 2 项 MISS，差点以为改动没生效）。
      # 所以这里轮询重试，直到新包出现。
      - name: 核查线上产物（新包是否真的上线）
        run: |
          for i in $(seq 1 12); do
            node tools/verify-live.mjs && exit 0
            echo "--- 第 $i 次未通过（新包可能还没刷到），等 45 秒再试"
            sleep 45
          done
          echo "12 次都没通过：线上跑的可能还是旧包，需要人工看一眼"
          exit 1
