<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AIVA 捏人预览台</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --line: #e3e6ea; --ink: #1c2024;
    --dim: #6b7280; --accent: #2563eb; --accent-soft: #e8f0fe;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column;
  }
  header {
    flex: 0 0 auto; padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .meta { color: var(--dim); font-variant-numeric: tabular-nums; }
  header .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--line); background: #fff; border-radius: 7px;
    padding: 5px 11px; font-size: 12px; cursor: pointer; color: var(--ink);
  }
  .btn:hover { background: #f0f2f5; }
  .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; min-width: 0; position: relative; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: absolute; left: 12px; bottom: 12px; color: var(--dim);
    background: rgba(255,255,255,.8); padding: 4px 9px; border-radius: 6px;
  }
  aside {
    flex: 0 0 320px; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 12px 14px 40px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab {
    flex: 1; text-align: center; padding: 6px 0; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); font-size: 12px;
  }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { margin-bottom: 9px; }
  .row label {
    display: flex; justify-content: space-between; font-size: 12px; color: #374151; margin-bottom: 2px;
  }
  .row label b { font-weight: 500; color: var(--dim); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); height: 16px; }
  .group-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line);
  }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #boot {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--dim); font-size: 13px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <h1>AIVA 捏人预览台</h1>
  <span class="meta" id="meta">载入中…</span>
  <span class="spacer"></span>
  <button class="btn" id="btnWire">网格线</button>
  <button class="btn" id="btnSkeleton">骨架</button>
  <button class="btn" id="btnSpin">自动旋转</button>
  <button class="btn" id="btnReset">复位</button>
  <button class="btn" id="btnRandom">随机</button>
</header>
<main>
  <div id="stage">
    <div id="boot">正在载入 GLB…</div>
    <div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>
  </div>
  <aside>
    <div class="tabs">
      <div class="tab on" data-tab="Body">体型</div>
      <div class="tab" data-tab="Face">面容</div>
    </div>
    <div id="presets" class="presets"></div>
    <div id="sliders"></div>
  </aside>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const GROUPS = { Body: [], Face: [] };
const PRESETS = {
  '默认':      {},
  '高挑':      { BodyHeight: 0.55, LegLength: 0.35, BodyProportions: 0.6, Weight: -0.15 },
  '娇小':      { BodyHeight: -0.5, Younger: 0.25, Weight: -0.2, HeadRound: 0.5, EyeSize: 0.6 },
  '健美':      { Muscle: 0.85, Weight: -0.1, TorsoVShape: 0.5, ArmMuscle: 0.6, ShoulderWidth: 0.3 },
  '丰满':      { Weight: 0.75, BustCirc: 0.6, HipsCirc: 0.55, ThighCirc: 0.5, Stomach: 0.4 },
  '男生':      { Masculine: 1, ShoulderWidth: 0.5, HipsCirc: -0.4, BustCirc: -0.5, TorsoVShape: 0.5, JawProminent: 0.6, HeadSquare: 0.4 },
  '精灵':      { EarPointed: 1, EyeSize: 0.5, HeadOval: 0.5, Weight: -0.25, ChinHeight: 0.4 },
  '成熟':      { Older: 0.7, HeadHeight: 0.2, NoseWidth: 0.25, EyeBag: 0.5 },
};

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f6f8);
const camera = new THREE.PerspectiveCamera(35, stage.clientWidth / stage.clientHeight, 0.05, 100);
camera.position.set(0, 1.05, 3.1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;
controls.autoRotateSpeed = 0.8;

scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3ad, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(1.6, 2.6, 2.4); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe6ff, 0.8); fill.position.set(-2.2, 1.2, 1.4); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffd9c2, 1.0); rim.position.set(-0.6, 1.8, -2.6); scene.add(rim);

const grid = new THREE.GridHelper(6, 24, 0xc8ced6, 0xe3e6ea);
scene.add(grid);

let body = null, skeletonHelper = null;

new GLTFLoader().load('/assets/models4/aiva-base-mh.glb', async (gltf) => {
  const root = new THREE.Group();
  root.add(gltf.scene);
  scene.add(root);
  body = null;
  gltf.scene.traverse((o) => {
    if (o.isMesh && o.morphTargetDictionary && !body) body = o;
  });
  if (!body) { boot('找不到带 morph 的 mesh'); return; }

  body.material = new THREE.MeshStandardMaterial({
    color: 0xe8c4b0, roughness: 0.62, metalness: 0.0,
  });
  // 关掉视锥剔除：morph 会让实际外形超出初始包围盒，糊在地模很多时候就是它在捣鬼
  body.frustumCulled = false;

  skeletonHelper = new THREE.SkeletonHelper(body);
  skeletonHelper.visible = false;
  scene.add(skeletonHelper);

  const meta = await (await fetch('/assets/models4/aiva-base-mh.sliders.json')).json();
  buildUI(meta);
  document.getElementById('boot').remove();
  const tris = body.geometry.index.count / 3;
  document.getElementById('meta').textContent =
    `${body.geometry.attributes.position.count} 顶点 · ${tris} 面 · ${body.skeleton.bones.length} 骨 · ${Object.keys(body.morphTargetDictionary).length} 滑块 · brotli 0.6MB`;
  window.__mhReady = true;
  animate();
}, undefined, (e) => boot('GLB 载入失败：' + e));

function boot(t) { document.getElementById('boot').textContent = t; }

// ---------- UI ----------
const influence = {};
function buildUI(meta) {
  for (const s of meta.sliders) {
    GROUPS[s.group] = GROUPS[s.group] || [];
    GROUPS[s.group].push(s);
  }
  const presetBox = document.getElementById('presets');
  for (const [name, vals] of Object.entries(PRESETS)) {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = name;
    b.onclick = () => {
      for (const s of [...GROUPS.Body, ...GROUPS.Face]) {
        const v = vals[s.key] ?? 0;
        influence[s.key] = v;
        body.morphTargetInfluences[s.index] = v;
        const el = document.getElementById('r_' + s.key);
        if (el) { el.value = v; el.parentElement.querySelector('b').textContent = v.toFixed(2); }
      }
    };
    presetBox.appendChild(b);
  }
  renderTab('Body');
  renderer.render(scene, camera);   // 立即出一帧，方便截图
}

function renderTab(tab) {
  const box = document.getElementById('sliders');
  box.innerHTML = `<div class="group-title">${tab === 'Body' ? '体型 / Body' : '面容 / Face'}</div>`;
  for (const s of GROUPS[tab]) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<label><span>${s.cn} <code style="color:#9ca3af">${s.key}</code></span><b>0.00</b></label>
      <input type="range" id="r_${s.key}" min="-1" max="1" step="0.01" value="0">`;
    const inp = row.querySelector('input');
    inp.oninput = () => {
      const v = parseFloat(inp.value);
      influence[s.key] = v;
      body.morphTargetInfluences[s.index] = v;
      row.querySelector('b').textContent = v.toFixed(2);
    };
    box.appendChild(row);
  }
}

document.querySelectorAll('.tab').forEach((t) => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
    t.classList.add('on');
    renderTab(t.dataset.tab);
  };
});

const toggle = (id, fn) => {
  const b = document.getElementById(id);
  b.onclick = () => { b.classList.toggle('on'); fn(b.classList.contains('on')); };
};
toggle('btnWire', (on) => { body.material.wireframe = on; });
toggle('btnSkeleton', (on) => { skeletonHelper.visible = on; });
toggle('btnSpin', (on) => { controls.autoRotate = on; });
document.getElementById('btnReset').onclick = () => {
  for (const s of [...GROUPS.Body, ...GROUPS.Face]) {
    document.getElementById('r_' + s.key).dispatchEvent(new Event('input'));
    const el = document.getElementById('r_' + s.key);
    el.value = 0; el.dispatchEvent(new Event('input'));
  }
  camera.position.set(0, 1.05, 3.1); controls.target.set(0, 0.95, 0); controls.update();
};
document.getElementById('btnRandom').onclick = () => {
  for (const s of [...GROUPS.Body, ...GROUPS.Face]) {
    const el = document.getElementById('r_' + s.key);
    const v = +(Math.random() * 0.7 - 0.35).toFixed(2);
    el.value = v; el.dispatchEvent(new Event('input'));
  }
};

addEventListener('resize', () => {
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
});

let needFrame = true;
function kick() { needFrame = true; }
controls.addEventListener('change', kick);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  if (!needFrame && !controls.autoRotate) return;
  needFrame = controls.autoRotate;
  renderer.render(scene, camera);
}
// 任何 morph 变动都要补一帧（上面的 bool 拦不住 orbit 之外的情况）
setInterval(kick, 200);
</script>
</body>
</html>
